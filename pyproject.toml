[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-mcp"
# Real version = git tag vX.Y.Z (see GitHub Releases); never bumped here. Taiga #2870.
version = "0.0.0"
description = "MCP server for LiteLLM proxy administration and execution"
requires-python = ">=3.12"
authors = [{ name = "TETRA" }]
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.30.0,<2",
    "httpx>=0.28.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Run unit tests",
    "integration: Run integration tests",
]
addopts = "-v"
asyncio_mode = "auto"

# Tag only: .github/workflows/release.yml tags the commit and creates the
# GitHub Release; nothing is committed to main.
[tool.semantic_release]
branch = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[dependency-groups]
# Dev tools live here, not in a [project.optional-dependencies] extra:
# Dependabot treats an extra as a runtime dependency (fix(deps), which cuts a
# release) and a dependency group as development (chore(deps-dev)). The image
# installs with --no-dev (Taiga T25.5 #3569).
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=4.1.0",
    "ruff>=0.17.4",
    "pre-commit>=4.7.0",
    "python-semantic-release>=10.7.0",
]
