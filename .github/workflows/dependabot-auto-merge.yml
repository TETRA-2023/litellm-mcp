# Auto-enable auto-merge on Dependabot PRs.
#
# Safe-by-design: this only *enables* GitHub auto-merge, which still waits for
# all required status checks (lint/test/secrets/docker) to pass before merging.
# A failing check => the PR stays queued and never merges.
#
# Only minor/patch bumps are auto-merged (allowlist). Majors — and any update
# fetch-metadata cannot classify (update-type is null for requirement-range
# changes, e.g. `mcp[cli]>=1.28.1` -> `>=2.2.0`) — wait for a human, matching
# our "review majors" policy. A `!= semver-major` denylist let those through.
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (minor/patch only)
        if: contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
