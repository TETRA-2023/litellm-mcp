# Auto-enable auto-merge on Dependabot PRs.
#
# Canonical copy: TETRA-2023/ci-workflows copies/dependabot-auto-merge.yml.
# Every repo with Dependabot carries this file byte-identical; change it there
# first (Taiga US-7 #2938).
#
# Safe only with required checks: this *enables* GitHub auto-merge, which
# waits for every REQUIRED status check, so a failing check keeps the PR queued.
# The repo needs (1) "Allow auto-merge" on and (2) required status checks on the
# target branch (classic protection or a ruleset rule), strict. The org ruleset
# `org-default-branch-pr` requires a PR but no checks. Without (2) the PR is
# already mergeable and `gh pr merge --auto` merges it at once, untested (#2638).
#
# Only minor/patch bumps are auto-merged (allowlist). Majors, and any update
# fetch-metadata cannot classify (update-type is null for requirement-range
# changes, e.g. `mcp[cli]>=1.28.1` -> `>=2.2.0`), wait for a human. A
# `!= semver-major` denylist let those through (litellm #70, keycloak #57).
#
# A PR that carries a commit from anyone else (a human fixing the bump) gets
# auto-merge switched OFF and waits for review: the earlier run already enabled
# it, and it would merge the extra commit unreviewed. The only other commit
# allowed is the merge commit dependabot-rebase.yml makes with the App
# (update-branch). Taken from SAI-AGENT-PLATFORM.
# So do not press "Update branch" on a Dependabot PR: that merge commit is
# yours, and auto-merge goes off. Let dependabot-rebase.yml do it; if you did
# press it, comment `@dependabot recreate` (rebase refuses an edited PR) to get
# auto-merge back. A commit whose email maps to no GitHub account (author
# null) counts as foreign too, on purpose.
#
# A PR that changes a file copied from ci-workflows (the two Dependabot files,
# and image.yml / release.yml when they are reusable copies, i.e. declare
# workflow_call) is held too: merged alone it would make the copy differ from
# the canonical file and turn the drift check red (2026-11-02 and 2026-11-09,
# docker/login-action). Bump the canonical file in ci-workflows first, then
# merge the held PR by hand or `@dependabot recreate` it (Taiga US-24 #3531).
# A caller of ci-workflows (no workflow_call) is not a copy and is not held.
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # GitHub-hosted on purpose: `gh` is on the image, and pull_request_target
    # carries write-scoped secrets, which have no business on a self-hosted
    # runner that bind-mounts the Docker socket.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on every push to a Dependabot PR, whoever pushed, so the guard
    # sees foreign commits; only Dependabot's own pushes enable auto-merge.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Require Dependabot-only commits
        id: commits
        run: |
          others=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[]
            | select(.author.login != "dependabot[bot]")
            | select(.author.login != "tetra-release[bot]" or (.parents | length) != 2)
            | .sha')
          if [ -n "$others" ]; then
            echo "::notice::Commits not from Dependabot, auto-merge off: $others"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr merge --disable-auto "$PR_URL" || true
          fi
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hold bumps of files copied from ci-workflows
        id: copies
        if: steps.commits.outputs.skip != 'true'
        run: |
          held=""
          while read -r f; do
            case "$f" in
              .github/workflows/dependabot-auto-merge.yml|.github/workflows/dependabot-rebase.yml)
                held="$held $f" ;;
              .github/workflows/image.yml|.github/workflows/release.yml)
                if gh api "repos/$REPO/contents/$f?ref=$BASE_SHA" --jq .content 2>/dev/null \
                    | base64 -d | grep -qE '^[[:space:]]*workflow_call:'; then
                  held="$held $f"
                fi ;;
            esac
          done < <(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [ -n "$held" ]; then
            msg="Changes a file copied from TETRA-2023/ci-workflows:$held. Auto-merge off: bump the canonical file there first, then merge this PR by hand or recreate it."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr merge --disable-auto "$PR_URL" || true
          fi
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Dependabot metadata
        id: meta
        if: steps.commits.outputs.skip != 'true' && steps.copies.outputs.skip != 'true' && github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # tetra-release App token, not a PAT (Taiga #2870). Workflows: write too,
      # because Dependabot's github-actions updates edit .github/workflows/.
      - name: App token
        id: app-token
        if: contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), steps.meta.outputs.update-type)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge (minor/patch only)
        if: contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # NOT GITHUB_TOKEN: a merge made with GITHUB_TOKEN fires no `push`
          # workflow, so the branch would get no CI, no release and no image.
          # The App merges as tetra-release[bot], so the push runs the full
          # pipeline. No fallback on purpose: if the key is unreadable, fail.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
