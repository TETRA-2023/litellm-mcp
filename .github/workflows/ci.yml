name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repo (full history)
        run: gitleaks detect --no-banner --redact --verbose

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        run: uv run pytest tests/test_server.py -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  docker:
    needs: [secrets, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      SMOKE_NAME: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image name
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container smoke test: start the REAL image through its entrypoint and
      # transport, then initialize + tools/list. Unit tests stayed green while
      # langfuse-mcp v1.1.6/v1.1.7 crash-looped at import in prod (2026-10-07,
      # TETRA-2023/langfuse-mcp#81); this step is what catches that. Dummy
      # credentials only: tools/list must not need a live LiteLLM proxy. No host port is published.
      - name: Smoke test image (initialize + tools/list)
        run: |
          python3 scripts/ci/mcp-smoke.py stdio -- \
            docker run -i --rm --name "$SMOKE_NAME" \
            -e LITELLM_BASE_URL=http://127.0.0.1:9 \
            -e LITELLM_API_KEY=sk-ci \
            mcp-smoke:ci
        timeout-minutes: 3

      - name: Smoke test logs and cleanup
        if: always()
        run: |
          docker logs --tail 50 "$SMOKE_NAME" 2>&1 || true
          docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (:latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.repo.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [secrets, test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: release
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Python Semantic Release
        run: |
          uv run semantic-release version --skip-build
          uv run semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
